<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription confirmée</title>
    <style>
        body { 
            background: #0A0D16; 
            color: #F1F3F9; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .container { 
            text-align: center; 
            max-width: 600px; 
        }
        .checkmark { 
            width: 100px; 
            height: 100px; 
            margin: 0 auto 40px; 
            background: #3DDC97; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #0A0D16; 
            font-size: 60px; 
            font-weight: bold;
            box-shadow: 0 10px 30px -8px rgba(61, 220, 151, 0.4);
        }
        h1 { 
            color: #F1F3F9; 
            font-size: 32px; 
            font-weight: 700; 
            margin: 0 0 24px;
            font-family: 'Sora', sans-serif;
        }
        p { 
            color: #8B93AC; 
            font-size: 16px; 
            line-height: 1.6; 
            margin: 0 0 40px; 
        }
        .whatsapp-button {
            display: inline-block;
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #25D366 0%, #1DA851 100%);
            border: none;
            border-radius: 16px;
            padding: 32px 24px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px -8px rgba(37, 211, 102, 0.5);
        }
        .whatsapp-button:hover {
            transform: scale(1.02);
        }
        .button-text {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            font-family: 'Sora', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Inscription confirmée !</h1>
        <p>Le lien Google Meet vous sera envoyé par e-mail avant l'événement.</p>
        
        <a href="https://chat.whatsapp.com/G5qrRv6lHz335EZplkksgj?s=cl&p=a&ilr=4" target="_blank" class="whatsapp-button">
            <span class="button-text">Rejoindre le groupe WhatsApp dédié au webinaire</span>
        </a>
    </div>
</body>
</html>
